<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SN BEAUTYNAILS | Exclusive Studio</title>
    
    <!-- PWA VE APPLE APP ETİKETLERİ -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SN Beauty">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/d81b60/ffffff?text=SN">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #d81b60; --bg-dark: #000000; --surface: rgba(28, 28, 30, 0.5); --border: rgba(255, 255, 255, 0.08); --text-main: #ffffff; --text-muted: #8e8e93; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; scroll-behavior: smooth; }

        .ambient-glow { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -2; opacity: 0.35; pointer-events: none; }
        .glow-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--accent); }
        .glow-2 { bottom: 10%; right: -10%; width: 40vw; height: 40vw; background: #4a001a; }

        header { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 1200px; padding: 18px 30px; display: flex; justify-content: space-between; align-items: center; background: rgba(20, 20, 22, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 1000; border: 1px solid var(--border); border-radius: 40px; }
        .logo { font-family: 'Dancing Script', cursive; font-size: 28px; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--accent); }
        .menu-toggle { display: none; font-size: 24px; color: var(--text-main); cursor: pointer; }
        nav { display: flex; align-items: center; }
        nav a { text-decoration: none; color: var(--text-muted); margin-left: 25px; font-size: 13px; font-weight: 500; transition: 0.3s; }
        nav a:hover { color: var(--text-main); }

        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; position: relative; }
        .hero-bg { position: absolute; top:0; left:0; width:100%; height:100%; background: url('https://images.unsplash.com/photo-1522337660859-02fbefca4702?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover; z-index: -1; opacity: 0.4; -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%); }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 5rem; font-weight: 600; line-height: 1.1; letter-spacing: -1px; }
        .hero h1 i { font-family: 'Dancing Script', cursive; color: var(--accent); font-size: 6rem; display: block; margin-top: -10px; font-weight: normal; }

        /* --- HİKAYELER (STORIES) --- */
        .stories-wrapper { padding: 120px 5% 20px; display: flex; gap: 15px; overflow-x: auto; scroll-snap-type: x mandatory; }
        .stories-wrapper::-webkit-scrollbar { display: none; }
        .story-bubble { width: 80px; height: 80px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); cursor: pointer; flex-shrink: 0; }
        .story-bubble img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg-dark); object-fit: cover; }
        .story-bubble span { display: block; text-align: center; font-size: 11px; margin-top: 5px; color: var(--text-main); font-weight: 500; }

        /* --- TAM EKRAN HİKAYE MODALI --- */
        .story-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; flex-direction: column; }
        .story-modal.active { display: flex; }
        .story-progress-container { display: flex; gap: 5px; padding: 15px; position: absolute; top: 0; width: 100%; z-index: 2; }
        .story-progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; overflow: hidden; }
        .story-progress-fill { height: 100%; background: #fff; width: 0%; }
        .story-close { position: absolute; top: 25px; right: 20px; color: #fff; font-size: 30px; z-index: 2; cursor: pointer; }
        .story-content { flex: 1; position: relative; display: flex; align-items: flex-end; padding: 40px 20px; background-size: cover; background-position: center; }
        .story-content::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(transparent, rgba(0,0,0,0.9)); z-index: 0; }
        .story-info { position: relative; z-index: 1; width: 100%; text-align: center; }
        .story-info h2 { font-family: 'Playfair Display', serif; margin-bottom: 15px; font-size: 2rem; }
        .swipe-up-btn { background: var(--text-main); color: var(--bg-dark); padding: 15px 30px; border-radius: 30px; font-weight: 600; text-transform: uppercase; border: none; cursor: pointer; }

        section { padding: 100px 8%; position: relative; z-index: 1; }
        .section-header { text-align: center; margin-bottom: 60px; }
        .section-header h2 { font-size: 2rem; font-weight: 600; letter-spacing: -0.5px; }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            header { width: 95%; top: 15px; padding: 15px 25px; border-radius: 30px; }
            .menu-toggle { display: block; }
            nav { position: absolute; top: 110%; left: 0; width: 100%; background: rgba(28,28,30,0.95); flex-direction: column; max-height: 0; overflow: hidden; transition: 0.4s; border-radius: 25px; }
            nav.active { max-height: 400px; padding: 20px 0; }
            nav a { margin: 15px 0; display: block; text-align: center; width: 100%; }
            .hero h1 { font-size: 3.5rem; }
            .hero h1 i { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header>
        <a href="#" class="logo">SN <span>Beautynails</span></a>
        <div class="menu-toggle" onclick="toggleMenu()">☰</div>
        <nav id="navMenu">
            <a href="#hizmetler">Hizmetler</a>
            <a href="#fiyatlar">Fiyatlar</a>
            <a href="#randevu">Randevu Al</a>
        </nav>
    </header>

    <!-- REELS / STORIES ALANI -->
    <div class="stories-wrapper">
        <div class="story-bubble" onclick="openStory('https://images.unsplash.com/photo-1519014816548-bf5fe059e98b?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80', 'Sonbahar Koleksiyonu', 'Kalıcı Oje')">
            <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059e98b?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Story">
            <span>Yeni Sezon</span>
        </div>
        <div class="story-bubble" onclick="openStory('https://images.unsplash.com/photo-1522337660859-02fbefca4702?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80', 'Gelin Tırnakları', 'Protez Tırnak')">
            <img src="https://images.unsplash.com/photo-1522337660859-02fbefca4702?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Story">
            <span>Gelin Art</span>
        </div>
        <div class="story-bubble" onclick="openStory('https://images.unsplash.com/photo-1604654894610-df63bc536371?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80', 'Müşteri Memnuniyeti', 'Nail Art')">
            <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Story">
            <span>Sizden Gelenler</span>
        </div>
    </div>

    <!-- HİKAYE MODALI -->
    <div class="story-modal" id="storyModal">
        <div class="story-progress-container">
            <div class="story-progress-bar"><div class="story-progress-fill" id="storyProgress"></div></div>
        </div>
        <div class="story-close" onclick="closeStory()">×</div>
        <div class="story-content" id="storyContent">
            <div class="story-info">
                <h2 id="storyTitle">Başlık</h2>
                <button class="swipe-up-btn" onclick="storyToBooking()">Bu İşlemi Yaptır</button>
            </div>
        </div>
    </div>

    <section class="hero" style="height: 60vh;">
        <div class="hero-bg"></div>
        <div>
            <h1>Sınırları Aşan <br><i>Tasarımlar</i></h1>
        </div>
    </section>

    <!-- Diğer Bölümler (Hizmetler, Form vb.) buraya gelecek (Önceki kodla aynı bırakabilirsin) -->
    
    <script>
        function toggleMenu() { document.getElementById('navMenu').classList.toggle('active'); }

        // HİKAYE (STORY) SİSTEMİ
        let storyTimer;
        let selectedService = '';
        
        function openStory(imgUrl, title, service) {
            const modal = document.getElementById('storyModal');
            document.getElementById('storyContent').style.backgroundImage = `url(${imgUrl})`;
            document.getElementById('storyTitle').innerText = title;
            selectedService = service;
            
            modal.classList.add('active');
            
            // 5 saniyelik progress bar animasyonu
            const progress = document.getElementById('storyProgress');
            progress.style.transition = 'none';
            progress.style.width = '0%';
            
            setTimeout(() => {
                progress.style.transition = 'width 5s linear';
                progress.style.width = '100%';
            }, 50);

            storyTimer = setTimeout(closeStory, 5000);
        }

        function closeStory() {
            document.getElementById('storyModal').classList.remove('active');
            clearTimeout(storyTimer);
        }

        function storyToBooking() {
            closeStory();
            alert(selectedService + " işlemi için randevu formuna yönlendiriliyorsunuz (Form kodunu buraya bağla).");
        }

        // PWA (Uygulama) Servis Çalışanı Kaydı
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Uygulama arka planda aktif!', reg))
                .catch(err => console.error('PWA hatası:', err));
            });
        }
    </script>
</body>
</html>
