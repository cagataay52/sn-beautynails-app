<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SN Mağaza | Evde Bakım Keşfi</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #f59e0b; /* Mağaza için altın sarısı aksan */ --bg-dark: #000000; --surface: rgba(28, 28, 30, 0.65); --border: rgba(255, 255, 255, 0.12); --text-main: #ffffff; --text-muted: #8e8e93; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100dvh; }

        .ambient-glow { position: fixed; border-radius: 50%; z-index: -2; pointer-events: none; transform: translateZ(0); }
        .glow-1 { top: -10%; left: -20%; width: 80vw; height: 80vw; background: #92400e; opacity: 0.45; filter: blur(140px); }
        .glow-2 { top: 40%; right: -20%; width: 70vw; height: 70vw; background: #d97706; opacity: 0.35; filter: blur(130px); }

        header { padding: 30px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.5); backdrop-filter: blur(20px); position: sticky; top:0; z-index: 100; }
        .logo { font-family: 'Dancing Script', cursive; font-size: 26px; color: var(--text-main); text-decoration: none; }
        .logo span { color: var(--accent); }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
        .back-link:hover { color: var(--text-main); }
        .cart-btn { background: var(--accent); color: var(--bg-dark); border: none; padding: 10px 20px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px; }

        .shop-header { text-align: center; padding: 60px 5% 40px; }
        .shop-header h1 { font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 10px; }
        .shop-header p { color: var(--text-muted); font-size: 1.1rem; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 0 5% 80px; max-width: 1400px; margin: 0 auto; }
        .product-card { background: var(--surface); border: 1px solid var(--border); padding: 20px; text-align: center; border-radius: 32px; backdrop-filter: blur(30px); display: flex; flex-direction: column; justify-content: space-between; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(255,255,255,0.3); }
        .product-card img { width: 100%; height: 250px; object-fit: contain; background: #fff; margin-bottom: 20px; border-radius: 20px; }
        .product-info h3 { font-size: 1.2rem; font-weight: 600; margin-bottom: 5px; }
        .product-info .price { color: var(--accent); font-size: 1.3rem; margin-bottom: 20px; display: block; font-weight: 500; }
        .add-to-cart { background: var(--text-main); color: var(--bg-dark); border: none; padding: 16px; font-weight: 600; border-radius: 20px; cursor: pointer; transition: 0.3s; font-size: 14px; width: 100%; margin-top: auto; }
        
        .loading { text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 50px; }

        @media (max-width: 768px) {
            .shop-header h1 { font-size: 2.2rem; }
            .shop-grid { grid-template-columns: 1fr; gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <header>
        <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
        <a href="#" class="logo">SN <span>Mağaza</span></a>
        <button class="cart-btn" onclick="sepetiGoster()">Sepet (<span id="cartCount">0</span>)</button>
    </header>

    <div class="shop-header">
        <h1>Tüm Ürünleri Keşfet</h1>
        <p>Salon kalitesini evinize taşıyın. Profesyonel bakım ürünlerimiz.</p>
    </div>

    <div class="shop-grid" id="shopGrid">
        <div class="loading">Ürünler Firebase'den yükleniyor...</div>
    </div>

    <!-- SEPET SİSTEMİ -->
    <script>
        let sepet = JSON.parse(localStorage.getItem('sn_sepet')) || []; 
        let toplamTutar = sepet.reduce((sum, urun) => sum + urun.fiyat, 0);

        function sepetiGuncelleUI() { document.getElementById('cartCount').innerText = sepet.length; }
        sepetiGuncelleUI();

        window.sepeteEkle = function(urunAdi, fiyat, btn) {
            sepet.push({isim: urunAdi, fiyat: parseFloat(fiyat)});
            toplamTutar += parseFloat(fiyat);
            localStorage.setItem('sn_sepet', JSON.stringify(sepet));
            sepetiGuncelleUI();
            
            let orijinalMetin = btn.innerText; btn.innerText = "Sepete Eklendi ✓"; btn.style.background = "var(--accent)";
            setTimeout(() => { btn.innerText = orijinalMetin; btn.style.background = "var(--text-main)"; }, 1500);
        }

        window.sepetiGoster = function() {
            if(sepet.length === 0) { alert("Sepetiniz Boş"); } else {
                let mesaj = "Sepetinizdekiler:\n";
                sepet.forEach(urun => mesaj += `- ${urun.isim} (${urun.fiyat} TL)\n`);
                mesaj += `\nToplam: ${toplamTutar} TL\n\nWhatsApp'tan sipariş vermek ister misiniz?`;
                if(confirm(mesaj)) { 
                    window.open(`https://wa.me/905551234567?text=Merhaba, şu ürünleri sipariş vermek istiyorum: ${sepet.map(u=>u.isim).join(', ')}. Toplam: ${toplamTutar} TL`, '_blank'); 
                    sepet = []; localStorage.removeItem('sn_sepet'); sepetiGuncelleUI();
                }
            }
        }
    </script>

    <!-- FİREBASE'DEN TÜM ÜRÜNLERİ ÇEKME -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDTPjmpnp7fD3LDRGekS1jZL-_yZI1JqTk",
            authDomain: "sn-beautynails.firebaseapp.com",
            projectId: "sn-beautynails",
            storageBucket: "sn-beautynails.firebasestorage.app",
            messagingSenderId: "877888681284",
            appId: "1:877888681284:web:14d82620cca85a9b625311",
            measurementId: "G-59DLV5MZGF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadAllShop() {
            try {
                // Sınırlama (limit) yok, admin panelindeki tüm ürünleri tarihe göre çeker
                const snap = await getDocs(query(collection(db, "urunler"), orderBy("zaman", "desc")));
                const wrapper = document.getElementById('shopGrid');
                
                if(!snap.empty) {
                    wrapper.innerHTML = "";
                    snap.forEach(doc => {
                        const d = doc.data();
                        wrapper.innerHTML += `
                        <div class="product-card">
                            <div class="product-img-box"><img src="${d.resim}" alt="${d.isim}"></div>
                            <div class="product-info"><h3>${d.isim}</h3><span class="price">${d.fiyat} TL</span></div>
                            <button class="add-to-cart" onclick="sepeteEkle('${d.isim}', ${d.fiyat}, this)">Sepete Ekle</button>
                        </div>`;
                    });
                } else {
                    wrapper.innerHTML = "<div class='loading'>Mağazada henüz ürün bulunmamaktadır.</div>";
                }
            } catch (e) { console.log(e); wrapper.innerHTML = "<div class='loading' style='color:red;'>Bağlantı hatası.</div>"; }
        }

        loadAllShop();
    </script>
</body>
</html>
