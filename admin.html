<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SN Studio | Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <!-- CHART.JS KÜTÜPHANESİ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f9; padding: 20px; display: flex; gap: 20px; margin: 0; }
        .sidebar { width: 250px; background: #1c1c1e; color: white; padding: 20px; border-radius: 20px; height: calc(100vh - 40px); }
        .sidebar h2 { color: #d81b60; margin-bottom: 40px; font-size: 20px; }
        .nav-item { padding: 15px; margin-bottom: 10px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: #d81b60; }
        
        .main-content { flex: 1; overflow-y: auto; }
        .dashboard-header { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: #111; }
        
        /* FİNANS KARTLARI (COST CONTROL) */
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .metric-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .metric-card h3 { margin: 0 0 10px; font-size: 14px; color: #666; text-transform: uppercase; letter-spacing: 1px; }
        .metric-card .value { font-size: 32px; font-weight: 600; color: #111; }
        .metric-card .profit { color: #25d366; }
        .metric-card .cost { color: #d81b60; }
        
        .chart-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 30px; height: 400px; }
    </style>
</head>
<body>

    <!-- SOL MENÜ -->
    <div class="sidebar">
        <h2>SN Studio App</h2>
        <div class="nav-item">📅 Randevular</div>
        <div class="nav-item">🎨 IG Stüdyo</div>
        <div class="nav-item active">📊 Maliyet & Finans</div>
    </div>

    <!-- SAĞ İÇERİK - COST CONTROL & FİNANS -->
    <div class="main-content">
        <div class="dashboard-header">Finansal Durum & Maliyet Kontrolü (2026)</div>
        
        <div class="metrics-grid">
            <div class="metric-card">
                <h3>Aylık Toplam Ciro</h3>
                <div class="value">₺124.500</div>
            </div>
            <div class="metric-card">
                <h3>Malzeme Giderleri (Cost)</h3>
                <div class="value cost">₺32.800</div>
            </div>
            <div class="metric-card">
                <h3>Net Kar Marjı</h3>
                <div class="value profit">%73.6</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="financeChart"></canvas>
        </div>
    </div>

    <script>
        // CHART.JS - GELİR GİDER GRAFİĞİ (2026)
        const ctx = document.getElementById('financeChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim'],
                datasets: [
                    {
                        label: 'Brüt Ciro (₺)',
                        data: [85000, 92000, 88000, 105000, 112000, 125000, 140000, 135000, 128000, 124500],
                        borderColor: '#111',
                        backgroundColor: 'rgba(17,17,17,0.1)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Gider Kalemleri (₺)',
                        data: [25000, 28000, 24000, 31000, 33000, 38000, 42000, 39000, 35000, 32800],
                        borderColor: '#d81b60',
                        borderWidth: 3,
                        borderDash: [5, 5],
                        tension: 0.4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top' },
                    title: { display: true, text: '2026 Ciro / Maliyet Analizi' }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
